name: Check Shopify deployment credentials

on:
  pull_request:
    paths:
      - '.github/workflows/check-shopify-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}
      SHOPIFY_API_PASSWORD: ${{ secrets.SHOPIFY_API_PASSWORD }}
      SHOPIFY_STORE_PASSWORD: ${{ secrets.SHOPIFY_STORE_PASSWORD }}
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
    steps:
      - name: Report presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SHOPIFY_ADMIN_ACCESS_TOKEN \
            SHOPIFY_ACCESS_TOKEN \
            SHOPIFY_CLI_THEME_TOKEN \
            SHOPIFY_THEME_TOKEN \
            SHOPIFY_API_PASSWORD \
            SHOPIFY_STORE_PASSWORD \
            SHOPIFY_STORE \
            SHOPIFY_SHOP; do
            if [ -n "${!name:-}" ]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=absent\n' "$name"
            fi
          done
