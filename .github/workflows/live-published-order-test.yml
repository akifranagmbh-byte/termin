name: Test live published Shopify order flow

on:
  pull_request:
    paths:
      - '.github/workflows/live-published-order-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-order-test:
    name: Live – echter Klick auf Neuzulassung
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Open the public storefront once and click the real order button
        shell: bash
        run: |
          set -euo pipefail
          WORK=/tmp/live-published-order
          mkdir -p "$WORK"
          cd "$WORK"

          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-audit --no-fund >/dev/null

          cat > test.js <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const STORE = 'https://kennzeichen-krefeld.com/';
          const EXPECTED_THEME_ID = 192982286602;
          const EXPECTED_VERSION = '2026-08-11.4';
          const EXPECTED_VARIANT = 51237294539018;
          const EXPECTED_PRICE = 12000;

          const candidates = [
            '/usr/bin/google-chrome-stable',
            '/usr/bin/google-chrome',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ];
          const executablePath = candidates.find((path) => fs.existsSync(path));
          if (!executablePath) throw new Error('Chrome/Chromium not found.');

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const isCheckout = (url) => /\/checkouts?\//.test(url) || url.includes('/checkout');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath,
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--no-first-run',
                '--no-default-browser-check',
                '--window-size=1440,1100',
              ],
            });

            const context = await browser.createBrowserContext();
            const page = await context.newPage();
            await page.setViewport({ width: 1440, height: 1100, deviceScaleFactor: 1 });

            const legacyRequests = [];
            const consoleErrors = [];
            page.on('request', (request) => {
              if (request.url().includes('/api/precheckout/intake')) {
                legacyRequests.push({ method: request.method(), url: request.url() });
              }
            });
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            try {
              const response = await page.goto(STORE, {
                waitUntil: 'domcontentloaded',
                timeout: 90000,
              });
              if (!response) throw new Error('No storefront response received.');
              console.log(`[storefront-http] ${response.status()}`);
              if (response.status() === 429) throw new Error('Shopify/Cloudflare rate-limited the test browser.');
              if (!response.ok()) throw new Error(`Storefront returned HTTP ${response.status()}.`);

              await page.waitForSelector('#kfz-fixed-order-form', { visible: true, timeout: 45000 });
              await sleep(2500);

              const before = await page.evaluate(() => {
                const visible = (element) => {
                  if (!element) return false;
                  const style = getComputedStyle(element);
                  const rect = element.getBoundingClientRect();
                  return !element.hidden && style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
                };
                const section = document.querySelector('#secure-ikfz');
                const fixed = document.querySelector('#kfz-fixed-order-form');
                const legacy = document.querySelector('#df-intake-form');
                const prep = document.querySelector('#secure-ikfz .df-prep');
                return {
                  theme: window.Shopify?.theme || null,
                  repairVersion: document.documentElement.getAttribute('data-kfz-order-fix'),
                  heading: section?.querySelector('h2')?.textContent?.trim() || '',
                  buttonText: fixed?.querySelector('button[type="submit"]')?.textContent?.trim() || '',
                  fixedVisible: visible(fixed),
                  legacyExists: Boolean(legacy),
                  legacyVisible: visible(legacy),
                  prepExists: Boolean(prep),
                  oldFailureTextPresent: /sichere übermittlung ist gerade nicht/i.test(section?.innerText || ''),
                };
              });

              console.log(`[before] ${JSON.stringify(before)}`);
              fs.writeFileSync('before.json', JSON.stringify(before, null, 2));
              await page.screenshot({ path: 'before-click.png', fullPage: false });

              if (Number(before.theme?.id) !== EXPECTED_THEME_ID) throw new Error(`Wrong live theme: ${JSON.stringify(before.theme)}`);
              if (before.repairVersion !== EXPECTED_VERSION) throw new Error(`Wrong repair version: ${before.repairVersion}`);
              if (!before.fixedVisible) throw new Error('The repaired order form is not visible.');
              if (before.legacyExists || before.legacyVisible || before.prepExists) throw new Error(`Legacy upload flow still exists: ${JSON.stringify(before)}`);
              if (before.oldFailureTextPresent) throw new Error('Old secure-transmission error text is still visible.');

              await page.select('#kfz-fixed-order-form select[name="service"]', 'neuzulassung');
              await sleep(500);
              await page.click('#kfz-fixed-order-form input[name="privacyAccepted"]');
              await sleep(700);

              const cartPromise = page.waitForResponse(
                (res) => res.url().includes('/cart/add.js') && res.request().method() === 'POST',
                { timeout: 45000 }
              );
              const navigationPromise = page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 60000 });

              await page.click('#kfz-fixed-order-form button[type="submit"]');
              const cartResponse = await cartPromise;
              const cartBody = await cartResponse.text();
              await navigationPromise;
              await sleep(1200);

              const finalUrl = page.url();
              console.log(`[cart-http] ${cartResponse.status()}`);
              console.log(`[checkout-url] ${finalUrl}`);
              console.log(`[cart-body] ${cartBody.slice(0, 1800)}`);

              if (cartResponse.status() !== 200) throw new Error(`Cart add returned HTTP ${cartResponse.status()}: ${cartBody}`);
              if (!isCheckout(finalUrl)) throw new Error(`Checkout was not reached: ${finalUrl}`);
              if (legacyRequests.length) throw new Error(`Broken Azure upload was called: ${JSON.stringify(legacyRequests)}`);

              const parsed = JSON.parse(cartBody);
              const item = Array.isArray(parsed.items) ? parsed.items[0] : parsed;
              const actualVariant = Number(item.variant_id || item.id);
              const actualPrice = Number(item.final_line_price || item.line_price || item.price);
              const properties = item.properties || {};

              if (actualVariant !== EXPECTED_VARIANT) throw new Error(`Wrong variant: ${actualVariant}`);
              if (actualPrice !== EXPECTED_PRICE) throw new Error(`Wrong price: ${actualPrice}`);
              if (properties.Zulassungsvorgang !== 'Neuzulassung') throw new Error(`Wrong service property: ${JSON.stringify(properties)}`);
              if (properties['Bestellablauf-Version'] !== EXPECTED_VERSION) throw new Error(`Wrong version property: ${JSON.stringify(properties)}`);
              if (properties.Unterlagenstatus !== 'Geschützter Upload-Link nach Bestellung erforderlich') throw new Error(`Wrong document status: ${JSON.stringify(properties)}`);

              const result = {
                passed: true,
                liveTheme: before.theme,
                repairVersion: before.repairVersion,
                finalUrl,
                cartStatus: cartResponse.status(),
                actualVariant,
                actualPrice,
                properties,
                legacyRequests,
                consoleErrors,
                note: 'Keine Bestellung abgeschlossen und keine Zahlung ausgelöst. Der Browserkontext mit seinem Testwarenkorb wird verworfen.',
              };
              fs.writeFileSync('result.json', JSON.stringify(result, null, 2));
              fs.writeFileSync('cart-response.json', JSON.stringify(parsed, null, 2));
              await page.screenshot({ path: 'checkout.png', fullPage: false });
              console.log(`[success] ${JSON.stringify(result)}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

          xvfb-run -a node test.js | tee test.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-published-order-test
          path: /tmp/live-published-order
          if-no-files-found: error
          retention-days: 1
