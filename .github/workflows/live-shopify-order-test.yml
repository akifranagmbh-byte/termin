name: Live Shopify order flow test — isolated customer sessions

on:
  pull_request:
    paths:
      - '.github/workflows/live-shopify-order-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-and-form:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify active theme repeatedly and render the repaired form
        shell: bash
        run: |
          set -euo pipefail
          STORE='https://kennzeichen-krefeld.com'

          for attempt in 1 2 3; do
            LIVE_URL="${STORE}/?live-theme-check=$(date +%s%N)-${attempt}"
            curl --max-time 60 --connect-timeout 15 -L -sS \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              -D "/tmp/theme-${attempt}-headers.txt" \
              -o "/tmp/theme-${attempt}.html" \
              "$LIVE_URL"

            marker=$(grep -Eo 'Shopify\.theme = \{[^;]+' "/tmp/theme-${attempt}.html" | head -1 || true)
            echo "attempt=${attempt} ${marker}"
            grep -q '"id":192981696778' "/tmp/theme-${attempt}.html"
            grep -q '"role":"main"' "/tmp/theme-${attempt}.html"
            grep -q 'kfz-order-fix.js' "/tmp/theme-${attempt}.html"
          done

          BROWSER=''
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              BROWSER=$(command -v "$candidate")
              break
            fi
          done
          test -n "$BROWSER"

          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disk-cache-size=1 \
            --media-cache-size=1 \
            --virtual-time-budget=18000 \
            --dump-dom \
            "${STORE}/?live-browser-check=$(date +%s%N)" > /tmp/live-rendered.html

          grep -n 'id="kfz-fixed-order-form"' /tmp/live-rendered.html | head -1
          grep -q 'Zulassung auswählen. Sicher bezahlen. Unterlagen geschützt nachreichen.' /tmp/live-rendered.html
          grep -Eq '<form id="df-intake-form"[^>]*hidden' /tmp/live-rendered.html
          for value in neuzulassung umschreibung wiederzulassung adress-namens-aenderung; do
            grep -q "value=\"${value}\"" /tmp/live-rendered.html
          done

      - name: Upload theme evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-theme-and-form-evidence
          path: |
            /tmp/theme-*.html
            /tmp/theme-*-headers.txt
            /tmp/live-rendered.html
          if-no-files-found: warn
          retention-days: 1

  service-checkout:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: neuzulassung
            label: Neuzulassung
            variant: '51237294539018'
            price: '12000'
            product_fragment: 'KFZ Anmeldung'
          - key: umschreibung
            label: Umschreibung
            variant: '53495252254986'
            price: '12000'
            product_fragment: 'Digitale Kfz-Umschreibung'
          - key: wiederzulassung
            label: Wiederzulassung
            variant: '53495253041418'
            price: '12000'
            product_fragment: 'Digitale Kfz-Wiederzulassung'
          - key: adress-namens-aenderung
            label: Adress- oder Namensänderung
            variant: '53495252910346'
            price: '4900'
            product_fragment: 'Digitale Kfz-Adress'

    steps:
      - name: Add selected service and reach checkout in an isolated session
        shell: bash
        env:
          SERVICE_KEY: ${{ matrix.key }}
          SERVICE_LABEL: ${{ matrix.label }}
          VARIANT_ID: ${{ matrix.variant }}
          EXPECTED_PRICE: ${{ matrix.price }}
          PRODUCT_FRAGMENT: ${{ matrix.product_fragment }}
        run: |
          set -euo pipefail
          STORE='https://kennzeichen-krefeld.com'
          VERSION='2026-08-11.3-LIVE-TEST'
          COOKIE="/tmp/${SERVICE_KEY}-cookies.txt"
          ADD_BODY="/tmp/${SERVICE_KEY}-cart-add.json"
          ADD_HEADERS="/tmp/${SERVICE_KEY}-cart-add-headers.txt"
          CHECKOUT_BODY="/tmp/${SERVICE_KEY}-checkout.html"
          CHECKOUT_HEADERS="/tmp/${SERVICE_KEY}-checkout-headers.txt"
          CLEAR_BODY="/tmp/${SERVICE_KEY}-cart-clear.json"

          cleanup() {
            if [ -f "$COOKIE" ]; then
              curl --max-time 30 --connect-timeout 10 -sS \
                -c "$COOKIE" -b "$COOKIE" \
                -X POST "${STORE}/cart/clear.js" \
                -H 'Accept: application/json' \
                -o "$CLEAR_BODY" || true
            fi
          }
          trap cleanup EXIT

          payload=$(python3 - "$VARIANT_ID" "$SERVICE_LABEL" "$VERSION" <<'PY'
          import json, sys
          variant, label, version = sys.argv[1:]
          print(json.dumps({
              'items': [{
                  'id': int(variant),
                  'quantity': 1,
                  'properties': {
                      'Zulassungsvorgang': label,
                      'Unterlagenstatus': 'Sicherer Yousign-Link nach Bestellung erforderlich',
                      'Bestellablauf-Version': version,
                  },
              }],
          }, ensure_ascii=False))
          PY
          )

          add_code=$(curl --max-time 45 --connect-timeout 15 -sS \
            -c "$COOKIE" -b "$COOKIE" \
            -D "$ADD_HEADERS" \
            -o "$ADD_BODY" -w '%{http_code}' \
            -X POST "${STORE}/cart/add.js" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$payload")
          echo "service=${SERVICE_LABEL} cart_add_http=${add_code}"
          test "$add_code" = '200'

          python3 - "$ADD_BODY" "$VARIANT_ID" "$SERVICE_LABEL" "$EXPECTED_PRICE" "$VERSION" <<'PY'
          import json, sys
          path, variant, label, expected_price, version = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          items = data.get('items') if isinstance(data, dict) else None
          if not items:
              items = [data]
          item = items[0]
          actual_variant = item.get('variant_id', item.get('id'))
          actual_price = item.get('final_line_price', item.get('line_price', item.get('price')))
          properties = item.get('properties') or {}
          assert int(actual_variant) == int(variant), item
          assert int(actual_price) == int(expected_price), item
          assert properties.get('Zulassungsvorgang') == label, item
          assert properties.get('Unterlagenstatus') == 'Sicherer Yousign-Link nach Bestellung erforderlich', item
          assert properties.get('Bestellablauf-Version') == version, item
          print('cart_add_verified=', item.get('title'), actual_price, properties)
          PY

          checkout_result=$(curl --max-time 60 --connect-timeout 15 -L -sS \
            -c "$COOKIE" -b "$COOKIE" \
            -D "$CHECKOUT_HEADERS" \
            -o "$CHECKOUT_BODY" \
            -w '%{http_code} %{url_effective}' \
            "${STORE}/checkout?isolated_live_test=$(date +%s%N)")
          echo "service=${SERVICE_LABEL} checkout=${checkout_result}"
          checkout_code=${checkout_result%% *}
          checkout_url=${checkout_result#* }
          test "$checkout_code" = '200'
          echo "$checkout_url" | grep -Eq '/checkout|/checkouts/'
          grep -Fq "$PRODUCT_FRAGMENT" "$CHECKOUT_BODY"

          cleanup
          grep -Eq '"item_count"[[:space:]]*:[[:space:]]*0' "$CLEAR_BODY"
          trap - EXIT

      - name: Upload service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-service-${{ matrix.key }}-evidence
          path: |
            /tmp/${{ matrix.key }}-cart-add.json
            /tmp/${{ matrix.key }}-cart-add-headers.txt
            /tmp/${{ matrix.key }}-checkout.html
            /tmp/${{ matrix.key }}-checkout-headers.txt
            /tmp/${{ matrix.key }}-cart-clear.json
          if-no-files-found: warn
          retention-days: 1
