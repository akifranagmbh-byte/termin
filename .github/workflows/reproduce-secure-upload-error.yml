name: Inspect live and preview Shopify order scripts

on:
  pull_request:
    paths:
      - '.github/workflows/reproduce-secure-upload-error.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-script-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect static HTML and browser-rendered order state
        shell: bash
        run: |
          set -euo pipefail
          LIVE="https://kennzeichen-krefeld.com/?script-inspect=$(date +%s%N)"
          PREVIEW="https://kennzeichen-krefeld.com/?preview_theme_id=192982286602&script-inspect=$(date +%s%N)"

          for pair in "live|$LIVE" "preview|$PREVIEW"; do
            label="${pair%%|*}"
            url="${pair#*|}"
            echo "=== ${label^^} STATIC: $url ==="
            curl --max-time 60 --connect-timeout 15 --retry 3 --retry-all-errors -L -sS \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$url" > "/tmp/${label}.html"
            grep -Eo 'Shopify\.theme = \{[^;]+' "/tmp/${label}.html" | head -1 || true
            python3 - "$label" <<'PY'
          import re, sys
          label = sys.argv[1]
          html = open(f'/tmp/{label}.html', encoding='utf-8', errors='replace').read()
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I):
              lowered = src.lower()
              if any(word in lowered for word in ('kfz', 'order-fix', 'jsdelivr', 'github', 'termin')):
                  print(f'{label}:script={src}')
          print(f'{label}:kfz-order-fix-occurrences={html.count("kfz-order-fix")}')
          print(f'{label}:legacy-error-text-occurrences={html.lower().count("die sichere \\u00fcbermittlung ist gerade nicht")}')
          PY
          done

          BROWSER=''
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then BROWSER=$(command -v "$candidate"); break; fi
          done
          test -n "$BROWSER"

          for pair in "live|$LIVE" "preview|$PREVIEW"; do
            label="${pair%%|*}"
            url="${pair#*|}"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=15000 --dump-dom "$url" > "/tmp/${label}-rendered.html"
            echo "=== ${label^^} RENDERED ==="
            grep -Eo 'Shopify\.theme = \{[^;]+' "/tmp/${label}-rendered.html" | head -1 || true
            python3 - "$label" <<'PY'
          import re, sys
          label = sys.argv[1]
          html = open(f'/tmp/{label}-rendered.html', encoding='utf-8', errors='replace').read()
          print(f'{label}:fixed-form={"id=\"kfz-fixed-order-form\"" in html}')
          print(f'{label}:legacy-form={"id=\"df-intake-form\"" in html}')
          print(f'{label}:legacy-error-text={"Die sichere \\u00dcbermittlung ist gerade nicht" in html or "Die sichere &Uuml;bermittlung ist gerade nicht" in html}')
          print(f'{label}:repair-version={re.findall(r"data-kfz-order-fix=\\\"([^\\\"]+)", html)[:3]}')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I):
              lowered = src.lower()
              if any(word in lowered for word in ('kfz', 'order-fix', 'jsdelivr', 'github', 'termin')):
                  print(f'{label}:rendered-script={src}')
          PY
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-order-script-sources
          path: /tmp/*live*.html
          if-no-files-found: warn
          retention-days: 1
