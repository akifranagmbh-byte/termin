name: Verify repaired Shopify order preview

on:
  pull_request:
    paths:
      - '.github/workflows/reproduce-secure-upload-error.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Test all four services in real Chrome sessions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kfz-preview-test
          cd /tmp/kfz-preview-test
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-audit --no-fund >/dev/null

          cat > test.js <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const STORE = 'https://kennzeichen-krefeld.com';
          const THEME_ID = 192982286602;
          const VERSION = '2026-08-11.4';
          const services = [
            ['neuzulassung', 51237294539018, 12000, 'Neuzulassung'],
            ['umschreibung', 53495252254986, 12000, 'Umschreibung'],
            ['wiederzulassung', 53495253041418, 12000, 'Wiederzulassung'],
            ['adress-namens-aenderung', 53495252910346, 4900, 'Adress- oder Namensänderung'],
          ];
          const candidates = [
            '/usr/bin/google-chrome-stable',
            '/usr/bin/google-chrome',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ];
          const executablePath = candidates.find((path) => fs.existsSync(path));
          if (!executablePath) throw new Error('Chrome/Chromium not found.');

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function testService(browser, service, variantId, expectedPrice, expectedTitle) {
            const context = await browser.createBrowserContext();
            const page = await context.newPage();
            await page.setViewport({ width: 1440, height: 1100, deviceScaleFactor: 1 });
            await page.setExtraHTTPHeaders({
              'Cache-Control': 'no-cache, no-store, max-age=0',
              Pragma: 'no-cache',
            });

            const azureRequests = [];
            let cartResponse = null;
            page.on('request', (request) => {
              if (request.url().includes('azurewebsites.net')) azureRequests.push(request.url());
            });
            page.on('response', async (response) => {
              if (!response.url().includes('/cart/add.js')) return;
              let body = '';
              try { body = await response.text(); } catch (_) {}
              cartResponse = { status: response.status(), body };
            });
            page.on('pageerror', (error) => console.log(`[${service}:pageerror] ${error.stack || error.message}`));
            page.on('console', (message) => {
              if (message.type() === 'error' || message.type() === 'warning') {
                console.log(`[${service}:console:${message.type()}] ${message.text()}`);
              }
            });

            const previewUrl = `${STORE}/?preview_theme_id=${THEME_ID}&service-test=${service}-${Date.now()}`;
            await page.goto(previewUrl, { waitUntil: 'networkidle2', timeout: 90000 });
            await page.waitForSelector('#kfz-fixed-order-form', { visible: true, timeout: 30000 });
            await sleep(1000);

            const state = await page.evaluate(() => {
              const fixed = document.querySelector('#kfz-fixed-order-form');
              const rect = fixed ? fixed.getBoundingClientRect() : null;
              return {
                theme: window.Shopify?.theme || null,
                repairVersion: document.documentElement.getAttribute('data-kfz-order-fix'),
                fixedExists: Boolean(fixed),
                fixedVisible: Boolean(rect && rect.width > 0 && rect.height > 0),
                legacyExists: Boolean(document.querySelector('#df-intake-form')),
                prepExists: Boolean(document.querySelector('#secure-ikfz .df-prep')),
                visibleText: document.querySelector('#secure-ikfz')?.innerText || '',
              };
            });
            console.log(`[${service}:state] ${JSON.stringify(state)}`);
            if (Number(state.theme?.id) !== THEME_ID) throw new Error(`${service}: wrong preview theme`);
            if (state.repairVersion !== VERSION) throw new Error(`${service}: wrong repair version`);
            if (!state.fixedExists || !state.fixedVisible) throw new Error(`${service}: repaired form not visible`);
            if (state.legacyExists || state.prepExists) throw new Error(`${service}: legacy upload still present`);
            if (/sichere übermittlung ist gerade nicht möglich/i.test(state.visibleText)) {
              throw new Error(`${service}: old failure message is still visible`);
            }

            await page.select('#kfz-fixed-order-form select[name="service"]', service);
            await page.click('#kfz-fixed-order-form input[name="privacyAccepted"]');
            await Promise.all([
              page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 60000 }),
              page.click('#kfz-fixed-order-form button[type="submit"]'),
            ]);

            const checkoutUrl = page.url();
            console.log(`[${service}:checkout] ${checkoutUrl}`);
            if (!/\/checkouts?\//.test(checkoutUrl) && !checkoutUrl.includes('/checkout')) {
              throw new Error(`${service}: checkout not reached`);
            }
            if (azureRequests.length !== 0) throw new Error(`${service}: legacy Azure endpoint was called`);
            if (!cartResponse || cartResponse.status !== 200) throw new Error(`${service}: cart add failed`);

            const parsed = JSON.parse(cartResponse.body);
            const item = Array.isArray(parsed.items) ? parsed.items[0] : parsed;
            if (Number(item.variant_id || item.id) !== variantId) throw new Error(`${service}: wrong variant`);
            if (Number(item.final_line_price || item.line_price || item.price) !== expectedPrice) {
              throw new Error(`${service}: wrong price`);
            }
            if (item.properties?.Zulassungsvorgang !== expectedTitle) throw new Error(`${service}: wrong title property`);
            if (item.properties?.['Bestellablauf-Version'] !== VERSION) throw new Error(`${service}: wrong flow version`);

            const clearPage = await context.newPage();
            await clearPage.goto(`${STORE}/cart?clear=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const cleared = await clearPage.evaluate(async () => {
              const response = await fetch('/cart/clear.js', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { Accept: 'application/json' },
              });
              return { status: response.status, data: await response.json() };
            });
            if (cleared.status !== 200 || cleared.data.item_count !== 0) throw new Error(`${service}: cart not cleared`);
            await page.screenshot({ path: `/tmp/kfz-preview-test/${service}.png`, fullPage: false });
            await context.close();
            console.log(`[${service}:success] variant=${variantId} price=${expectedPrice}`);
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath,
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage', '--disable-gpu'],
            });
            try {
              for (const service of services) await testService(browser, ...service);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

          node test.js | tee /tmp/kfz-preview-test/test.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-shopify-preview-evidence
          path: /tmp/kfz-preview-test
          if-no-files-found: error
          retention-days: 1
