name: Reproduce secure upload live error

on:
  pull_request:
    paths:
      - '.github/workflows/reproduce-secure-upload-error.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-live-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exercise the visible form and the legacy Azure upload in Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kfz-secure-upload-test
          cd /tmp/kfz-secure-upload-test

          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-audit --no-fund >/dev/null

          python3 - <<'PY'
          import base64
          from pathlib import Path

          png = base64.b64decode(
              'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z4p8AAAAASUVORK5CYII='
          )
          for name in ('part1-front.png', 'part1-back.png', 'part2.png'):
              Path('/tmp/kfz-secure-upload-test', name).write_bytes(png)
          PY

          cat > live-test.js <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const STORE = 'https://kennzeichen-krefeld.com';
          const candidates = [
            '/usr/bin/google-chrome-stable',
            '/usr/bin/google-chrome',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ];
          const executablePath = candidates.find((candidate) => fs.existsSync(candidate));
          if (!executablePath) throw new Error('No Chrome/Chromium executable found.');

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const importantUrl = (url) =>
            url.includes('azurewebsites.net') ||
            url.includes('/cart/add') ||
            url.includes('/cart/clear') ||
            url.includes('/checkout');

          async function attachDiagnostics(page, label) {
            page.on('console', (message) => {
              console.log(`[${label}:console:${message.type()}] ${message.text()}`);
            });
            page.on('pageerror', (error) => {
              console.log(`[${label}:pageerror] ${error.stack || error.message}`);
            });
            page.on('requestfailed', (request) => {
              if (importantUrl(request.url())) {
                console.log(
                  `[${label}:requestfailed] ${request.method()} ${request.url()} :: ${JSON.stringify(request.failure())}`
                );
              }
            });
            page.on('response', async (response) => {
              if (!importantUrl(response.url())) return;
              let body = '';
              try {
                body = await response.text();
              } catch (error) {
                body = `<body unavailable: ${error.message}>`;
              }
              console.log(
                `[${label}:response] ${response.status()} ${response.request().method()} ${response.url()} :: ${body.slice(0, 1200)}`
              );
            });
          }

          async function formState(page) {
            return page.evaluate(() => {
              const visible = (element) => {
                if (!element) return false;
                const style = window.getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return (
                  !element.hidden &&
                  style.display !== 'none' &&
                  style.visibility !== 'hidden' &&
                  Number(style.opacity || '1') > 0 &&
                  rect.width > 0 &&
                  rect.height > 0
                );
              };
              const fixed = document.querySelector('#kfz-fixed-order-form');
              const legacy = document.querySelector('#df-intake-form');
              return {
                url: location.href,
                title: document.title,
                theme: window.Shopify && window.Shopify.theme ? window.Shopify.theme : null,
                repairFlag: document.documentElement.getAttribute('data-kfz-order-fix'),
                fixedExists: Boolean(fixed),
                fixedVisible: visible(fixed),
                legacyExists: Boolean(legacy),
                legacyHiddenAttribute: legacy ? legacy.hidden : null,
                legacyVisible: visible(legacy),
                mainHeading: document.querySelector('#secure-ikfz h2')?.textContent?.trim() || '',
                visibleStatus: Array.from(document.querySelectorAll('#secure-ikfz [role="alert"], #secure-ikfz [role="status"]'))
                  .filter(visible)
                  .map((element) => element.textContent.trim())
                  .filter(Boolean),
              };
            });
          }

          async function waitForCheckoutOrStatus(page, statusSelector, timeoutMs) {
            const started = Date.now();
            while (Date.now() - started < timeoutMs) {
              const result = await page.evaluate((selector) => ({
                url: location.href,
                status: document.querySelector(selector)?.textContent?.trim() || '',
              }), statusSelector);
              if (/\/checkouts?\//.test(result.url) || result.url.includes('/checkout')) return result;
              if (result.status) console.log(`[poll] ${JSON.stringify(result)}`);
              await sleep(500);
            }
            return page.evaluate((selector) => ({
              url: location.href,
              status: document.querySelector(selector)?.textContent?.trim() || '',
            }), statusSelector);
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath,
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu',
                '--no-first-run',
                '--no-default-browser-check',
              ],
            });

            try {
              const page = await browser.newPage();
              await attachDiagnostics(page, 'visible-flow');
              await page.setViewport({ width: 1440, height: 1100, deviceScaleFactor: 1 });
              await page.setExtraHTTPHeaders({
                'Cache-Control': 'no-cache, no-store, max-age=0',
                Pragma: 'no-cache',
              });
              const url = `${STORE}/?actual-submit-test=${Date.now()}`;
              await page.goto(url, { waitUntil: 'networkidle2', timeout: 90000 });
              await sleep(2500);

              const before = await formState(page);
              console.log(`[visible-flow:before] ${JSON.stringify(before)}`);
              fs.writeFileSync('/tmp/kfz-secure-upload-test/visible-before.json', JSON.stringify(before, null, 2));
              await page.screenshot({ path: '/tmp/kfz-secure-upload-test/visible-before.png', fullPage: true });

              if (!before.fixedExists || !before.fixedVisible) {
                throw new Error(`The repaired visible form is not active: ${JSON.stringify(before)}`);
              }
              if (before.legacyVisible) {
                throw new Error(`The legacy Azure form is still visible: ${JSON.stringify(before)}`);
              }

              await page.select('#kfz-fixed-order-form select[name="service"]', 'neuzulassung');
              await page.click('#kfz-fixed-order-form input[type="checkbox"]');
              await page.click('#kfz-fixed-order-form button[type="submit"]');
              const visibleResult = await waitForCheckoutOrStatus(page, '#kfz-fixed-order-form .kfz-fixed-status', 35000);
              console.log(`[visible-flow:after-submit] ${JSON.stringify(visibleResult)}`);
              fs.writeFileSync('/tmp/kfz-secure-upload-test/visible-result.json', JSON.stringify(visibleResult, null, 2));
              await page.screenshot({ path: '/tmp/kfz-secure-upload-test/visible-after.png', fullPage: true });

              if (!/\/checkouts?\//.test(visibleResult.url) && !visibleResult.url.includes('/checkout')) {
                throw new Error(`Visible form did not reach checkout: ${JSON.stringify(visibleResult)}`);
              }

              const clearPage = await browser.newPage();
              await attachDiagnostics(clearPage, 'clear-cart');
              await clearPage.goto(`${STORE}/cart?clear-test=${Date.now()}`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });
              const clearResult = await clearPage.evaluate(async () => {
                const response = await fetch('/cart/clear.js', {
                  method: 'POST',
                  credentials: 'same-origin',
                  headers: { Accept: 'application/json' },
                });
                return { status: response.status, body: await response.text() };
              });
              console.log(`[clear-cart:result] ${JSON.stringify(clearResult)}`);
              await clearPage.close();

              const legacyPage = await browser.newPage();
              await attachDiagnostics(legacyPage, 'legacy-upload');
              await legacyPage.setViewport({ width: 1440, height: 1100, deviceScaleFactor: 1 });
              await legacyPage.setExtraHTTPHeaders({
                'Cache-Control': 'no-cache, no-store, max-age=0',
                Pragma: 'no-cache',
              });
              await legacyPage.goto(`${STORE}/?legacy-endpoint-test=${Date.now()}`, {
                waitUntil: 'networkidle2',
                timeout: 90000,
              });
              await sleep(2000);

              await legacyPage.evaluate(() => {
                document.querySelector('#kfz-fixed-order-form')?.remove();
                const legacy = document.querySelector('#df-intake-form');
                if (!legacy) throw new Error('Legacy form not found.');
                legacy.hidden = false;
                legacy.style.display = 'block';
                const guide = document.querySelector('#df-prep-ok');
                if (guide) guide.checked = true;
              });

              await legacyPage.select('#df-intake-form select[name="service"]', 'neuzulassung');
              await legacyPage.type('#df-intake-form input[name="firstName"]', 'TEST-AUTOMATION');
              await legacyPage.type('#df-intake-form input[name="lastName"]', 'NICHT-BEARBEITEN');
              await legacyPage.type('#df-intake-form input[name="birthDate"]', '1990-01-01');
              await legacyPage.type('#df-intake-form input[name="street"]', 'Teststrasse');
              await legacyPage.type('#df-intake-form input[name="houseNumber"]', '1');
              await legacyPage.type('#df-intake-form input[name="postalCode"]', '47829');
              await legacyPage.type('#df-intake-form input[name="city"]', 'Krefeld');
              await legacyPage.type('#df-intake-form input[name="iban"]', 'DE89370400440532013000');

              const front = await legacyPage.$('#df-intake-form input[name="registrationCertificatePart1Front"]');
              const back = await legacyPage.$('#df-intake-form input[name="registrationCertificatePart1Back"]');
              const part2 = await legacyPage.$('#df-intake-form input[name="registrationCertificatePart2"]');
              await front.uploadFile('/tmp/kfz-secure-upload-test/part1-front.png');
              await back.uploadFile('/tmp/kfz-secure-upload-test/part1-back.png');
              await part2.uploadFile('/tmp/kfz-secure-upload-test/part2.png');
              await legacyPage.click('#df-intake-form .df-consent input[type="checkbox"]');

              const legacyBefore = await formState(legacyPage);
              console.log(`[legacy-upload:before] ${JSON.stringify(legacyBefore)}`);
              await legacyPage.click('#df-intake-form button[type="submit"]');
              const legacyResult = await waitForCheckoutOrStatus(legacyPage, '#df-status', 35000);
              const legacyDetails = await legacyPage.evaluate(() => ({
                url: location.href,
                status: document.querySelector('#df-status')?.textContent?.trim() || '',
                statusClass: document.querySelector('#df-status')?.className || '',
                buttonText: document.querySelector('#df-intake-form button[type="submit"]')?.textContent?.trim() || '',
                buttonDisabled: Boolean(document.querySelector('#df-intake-form button[type="submit"]')?.disabled),
              }));
              console.log(`[legacy-upload:after-submit] ${JSON.stringify({ ...legacyResult, ...legacyDetails })}`);
              fs.writeFileSync(
                '/tmp/kfz-secure-upload-test/legacy-result.json',
                JSON.stringify({ ...legacyResult, ...legacyDetails }, null, 2)
              );
              await legacyPage.screenshot({ path: '/tmp/kfz-secure-upload-test/legacy-after.png', fullPage: true });
              await legacyPage.close();
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exitCode = 1;
          });
          NODE

          node live-test.js | tee /tmp/kfz-secure-upload-test/browser.log

      - name: Call the Azure intake endpoint directly with the same multipart fields
        if: always()
        shell: bash
        run: |
          set +e
          ENDPOINT='https://fn-kfz-zulassung-prod-260810-czaxc8chcze9eufb.germanywestcentral-01.azurewebsites.net/api/precheckout/intake'
          curl --max-time 90 --connect-timeout 20 -sS -i \
            -H 'Origin: https://kennzeichen-krefeld.com' \
            -H 'Accept: application/json' \
            -F 'service=neuzulassung' \
            -F 'firstName=TEST-AUTOMATION' \
            -F 'lastName=NICHT-BEARBEITEN' \
            -F 'birthDate=1990-01-01' \
            -F 'street=Teststrasse' \
            -F 'houseNumber=1' \
            -F 'postalCode=47829' \
            -F 'city=Krefeld' \
            -F 'iban=DE89370400440532013000' \
            -F 'registrationCertificatePart1Front=@/tmp/kfz-secure-upload-test/part1-front.png;type=image/png' \
            -F 'registrationCertificatePart1Back=@/tmp/kfz-secure-upload-test/part1-back.png;type=image/png' \
            -F 'registrationCertificatePart2=@/tmp/kfz-secure-upload-test/part2.png;type=image/png' \
            "$ENDPOINT" | tee /tmp/kfz-secure-upload-test/azure-direct-response.txt
          echo "curl_exit=${PIPESTATUS[0]}" | tee -a /tmp/kfz-secure-upload-test/azure-direct-response.txt
          exit 0

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-upload-reproduction-20260811
          path: /tmp/kfz-secure-upload-test
          if-no-files-found: error
          retention-days: 1
