name: Test emergency Shopify order page

on:
  pull_request:
    paths:
      - '.github/workflows/test-emergency-order-page.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-emergency-order-page:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Open emergency page and click the real order link in Chrome
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/kfz-emergency-page-test
          mkdir -p "$OUT"
          cd "$OUT"
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-audit --no-fund >/dev/null

          cat > test.js <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const candidates = [
            '/usr/bin/google-chrome-stable',
            '/usr/bin/google-chrome',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ];
          const executablePath = candidates.find((candidate) => fs.existsSync(candidate));
          if (!executablePath) throw new Error('Chrome/Chromium not found.');

          const PAGE = 'https://kennzeichen-krefeld.com/bestellen';
          const EXPECTED_VARIANT = 51237294539018;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const isCheckout = (url) => /\/checkouts?\//.test(url) || url.includes('/checkout');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath,
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--no-first-run',
                '--no-default-browser-check',
                '--window-size=1440,1100',
              ],
            });

            const context = await browser.createBrowserContext();
            const page = await context.newPage();
            await page.setViewport({ width: 1440, height: 1100, deviceScaleFactor: 1 });

            try {
              const response = await page.goto(PAGE, { waitUntil: 'domcontentloaded', timeout: 90000 });
              if (!response || !response.ok()) {
                throw new Error(`Emergency page failed: ${response ? response.status() : 'no response'}`);
              }

              const linkSelector = `a[href*="/cart/${EXPECTED_VARIANT}:1"]`;
              await page.waitForSelector(linkSelector, { visible: true, timeout: 45000 });
              await sleep(1000);

              const before = await page.evaluate((selector) => ({
                title: document.title,
                heading: document.querySelector('h1')?.textContent?.trim() || '',
                buttonText: document.querySelector(selector)?.textContent?.trim() || '',
                href: document.querySelector(selector)?.href || '',
              }), linkSelector);
              console.log(`[page] ${JSON.stringify(before)}`);
              fs.writeFileSync('before.json', JSON.stringify(before, null, 2));
              await page.screenshot({ path: 'emergency-page.png', fullPage: true });

              if (!/Kfz-Zulassung jetzt bestellen/i.test(before.heading)) {
                throw new Error(`Wrong page heading: ${before.heading}`);
              }
              if (!/Neuzulassung bestellen/i.test(before.buttonText)) {
                throw new Error(`Neuzulassung link missing: ${before.buttonText}`);
              }

              const navigation = page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.click(linkSelector);
              const targetNavigation = await navigation;
              await sleep(1200);

              let targetUrl = page.url();
              let targetStatus = targetNavigation ? targetNavigation.status() : null;
              let targetState = await page.evaluate(() => ({
                title: document.title,
                text: document.body.innerText.slice(0, 8000),
                checkoutSelector: [
                  'button[name="checkout"]',
                  'input[name="checkout"]',
                  'a[href="/checkout"]',
                ].find((selector) => document.querySelector(selector)) || '',
              }));
              console.log(`[target] ${JSON.stringify({ targetUrl, targetStatus, targetState })}`);
              fs.writeFileSync('target.json', JSON.stringify({ targetUrl, targetStatus, targetState }, null, 2));
              await page.screenshot({ path: 'target.png', fullPage: true });

              if (targetStatus === 429 || /Verifying your connection/i.test(targetState.title + ' ' + targetState.text)) {
                throw new Error('Shopify anti-bot verification blocked the test browser.');
              }
              if (!/KFZ Anmeldung|Neuzulassung/i.test(targetState.text)) {
                throw new Error('The expected Zulassung item is not visible after clicking the order link.');
              }
              if (!/120[,.]00|120\s*€/i.test(targetState.text)) {
                throw new Error('The expected 120 EUR price is not visible after clicking the order link.');
              }

              if (!isCheckout(targetUrl)) {
                if (!targetState.checkoutSelector) {
                  throw new Error('Neither checkout nor a checkout button was reached.');
                }
                const checkoutNavigation = page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.click(targetState.checkoutSelector);
                await checkoutNavigation;
                await sleep(1000);
                targetUrl = page.url();
                if (!isCheckout(targetUrl)) {
                  throw new Error(`Checkout not reached: ${targetUrl}`);
                }
              }

              await page.screenshot({ path: 'checkout.png', fullPage: false });
              const result = {
                passed: true,
                emergencyPage: PAGE,
                checkoutUrl: targetUrl,
                variantId: EXPECTED_VARIANT,
                expectedPriceCents: 12000,
                noOrderCompleted: true,
                noPaymentSubmitted: true,
                note: 'The isolated browser context, including its test checkout, is discarded when Chrome closes.',
              };
              console.log(`[success] ${JSON.stringify(result)}`);
              fs.writeFileSync('result.json', JSON.stringify(result, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

          xvfb-run -a node test.js | tee test.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-order-page-test
          path: /tmp/kfz-emergency-page-test
          if-no-files-found: error
          retention-days: 1
