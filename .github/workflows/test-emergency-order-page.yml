name: Test emergency Shopify order page

on:
  pull_request:
    paths:
      - '.github/workflows/test-emergency-order-page.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-emergency-order-page:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Open emergency page and reach checkout in Chrome
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/kfz-emergency-page-test
          mkdir -p "$OUT"
          cd "$OUT"
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-audit --no-fund >/dev/null

          cat > test.js <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const candidates = [
            '/usr/bin/google-chrome-stable',
            '/usr/bin/google-chrome',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ];
          const executablePath = candidates.find((candidate) => fs.existsSync(candidate));
          if (!executablePath) throw new Error('Chrome/Chromium not found.');

          const PAGE = 'https://kennzeichen-krefeld.com/bestellen';
          const EXPECTED_VARIANT = 51237294539018;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const isCheckout = (url) => /\/checkouts?\//.test(url) || url.includes('/checkout');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath,
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--no-first-run',
                '--no-default-browser-check',
                '--window-size=1440,1100',
              ],
            });

            const context = await browser.createBrowserContext();
            const page = await context.newPage();
            await page.setViewport({ width: 1440, height: 1100, deviceScaleFactor: 1 });

            try {
              const response = await page.goto(PAGE, { waitUntil: 'domcontentloaded', timeout: 90000 });
              if (!response) throw new Error('No response from emergency page.');
              console.log(`[page-http] ${response.status()}`);
              console.log(`[page-url] ${page.url()}`);
              if (!response.ok()) throw new Error(`Emergency page returned HTTP ${response.status()}.`);

              await page.waitForSelector(`a[href*="/cart/${EXPECTED_VARIANT}:1"]`, { visible: true, timeout: 45000 });
              await sleep(1400);

              const before = await page.evaluate((variant) => ({
                title: document.title,
                heading: document.querySelector('h1')?.textContent?.trim() || '',
                bodyText: document.body.innerText.slice(0, 3000),
                buttonText: document.querySelector(`a[href*="/cart/${variant}:1"]`)?.textContent?.trim() || '',
              }), EXPECTED_VARIANT);
              console.log(`[before] ${JSON.stringify(before)}`);
              fs.writeFileSync('before.json', JSON.stringify(before, null, 2));
              await page.screenshot({ path: 'emergency-page.png', fullPage: true });

              if (!/Kfz-Zulassung direkt bestellen/i.test(before.heading)) {
                throw new Error(`Wrong emergency page heading: ${before.heading}`);
              }
              if (!/Neuzulassung bestellen/i.test(before.buttonText)) {
                throw new Error(`Neuzulassung link missing: ${before.buttonText}`);
              }

              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 60000 }),
                page.click(`a[href*="/cart/${EXPECTED_VARIANT}:1"]`),
              ]);
              await sleep(1200);
              console.log(`[cart-url] ${page.url()}`);

              const cart = await page.evaluate(() => ({
                text: document.body.innerText.slice(0, 5000),
                checkoutButton: Boolean(document.querySelector('button[name="checkout"], input[name="checkout"], a[href="/checkout"]')),
              }));
              fs.writeFileSync('cart.json', JSON.stringify(cart, null, 2));
              await page.screenshot({ path: 'cart.png', fullPage: true });

              if (!/120[,.]00|120\s*€/i.test(cart.text)) {
                throw new Error('The cart does not show the expected 120 EUR item.');
              }

              const checkoutSelector = 'button[name="checkout"], input[name="checkout"], a[href="/checkout"]';
              await page.waitForSelector(checkoutSelector, { visible: true, timeout: 30000 });
              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 60000 }),
                page.click(checkoutSelector),
              ]);
              await sleep(900);

              const result = {
                passed: true,
                emergencyPage: PAGE,
                cartUrl: page.url(),
                reachedCheckout: isCheckout(page.url()),
                expectedVariant: EXPECTED_VARIANT,
                note: 'No order completed and no payment submitted. Isolated browser context discarded.',
              };
              console.log(`[result] ${JSON.stringify(result)}`);
              fs.writeFileSync('result.json', JSON.stringify(result, null, 2));
              await page.screenshot({ path: 'checkout.png', fullPage: false });

              if (!result.reachedCheckout) throw new Error(`Checkout not reached: ${page.url()}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

          xvfb-run -a node test.js | tee test.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-order-page-test
          path: /tmp/kfz-emergency-page-test
          if-no-files-found: error
          retention-days: 1
