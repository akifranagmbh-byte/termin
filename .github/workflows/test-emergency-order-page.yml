name: Test emergency Shopify order page

on:
  pull_request:
    paths:
      - '.github/workflows/test-emergency-order-page.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-emergency-order-page:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Open emergency page and reach checkout in Chrome
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/kfz-emergency-page-test
          mkdir -p "$OUT"
          cd "$OUT"
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-audit --no-fund >/dev/null

          cat > test.js <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const candidates = [
            '/usr/bin/google-chrome-stable',
            '/usr/bin/google-chrome',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ];
          const executablePath = candidates.find((candidate) => fs.existsSync(candidate));
          if (!executablePath) throw new Error('Chrome/Chromium not found.');

          const PAGE = 'https://kennzeichen-krefeld.com/bestellen';
          const EXPECTED_VARIANT = 51237294539018;
          const EXPECTED_PRICE = 12000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const isCheckout = (url) => /\/checkouts?\//.test(url) || url.includes('/checkout');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath,
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--no-first-run',
                '--no-default-browser-check',
                '--window-size=1440,1100',
              ],
            });

            const context = await browser.createBrowserContext();
            const page = await context.newPage();
            await page.setViewport({ width: 1440, height: 1100, deviceScaleFactor: 1 });

            async function clearCart() {
              return page.evaluate(async () => {
                const response = await fetch('/cart/clear.js', {
                  method: 'POST',
                  credentials: 'same-origin',
                  headers: { Accept: 'application/json' },
                });
                return { status: response.status, body: await response.json() };
              });
            }

            try {
              const response = await page.goto(PAGE, { waitUntil: 'domcontentloaded', timeout: 90000 });
              if (!response || !response.ok()) {
                throw new Error(`Emergency page failed: ${response ? response.status() : 'no response'}`);
              }

              const linkSelector = `a[href*="/cart/${EXPECTED_VARIANT}:1"]`;
              await page.waitForSelector(linkSelector, { visible: true, timeout: 45000 });
              await sleep(1000);
              const before = await page.evaluate((selector) => ({
                title: document.title,
                heading: document.querySelector('h1')?.textContent?.trim() || '',
                buttonText: document.querySelector(selector)?.textContent?.trim() || '',
                href: document.querySelector(selector)?.href || '',
              }), linkSelector);
              console.log(`[page] ${JSON.stringify(before)}`);
              fs.writeFileSync('before.json', JSON.stringify(before, null, 2));
              await page.screenshot({ path: 'emergency-page.png', fullPage: true });

              if (!/Kfz-Zulassung jetzt bestellen/i.test(before.heading)) {
                throw new Error(`Wrong page heading: ${before.heading}`);
              }
              if (!/Neuzulassung bestellen/i.test(before.buttonText)) {
                throw new Error(`Neuzulassung link missing: ${before.buttonText}`);
              }

              const cleared = await clearCart();
              if (cleared.status !== 200 || cleared.body.item_count !== 0) {
                throw new Error(`Could not clear test cart: ${JSON.stringify(cleared)}`);
              }

              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 60000 }),
                page.click(linkSelector),
              ]);
              await sleep(1000);

              const cart = await page.evaluate(async () => {
                const response = await fetch('/cart.js', {
                  credentials: 'same-origin',
                  headers: { Accept: 'application/json' },
                });
                return { status: response.status, body: await response.json() };
              });
              console.log(`[cart] ${JSON.stringify(cart)}`);
              fs.writeFileSync('cart.json', JSON.stringify(cart, null, 2));
              await page.screenshot({ path: 'cart.png', fullPage: true });

              if (cart.status !== 200 || cart.body.item_count !== 1) {
                throw new Error(`Wrong cart item count: ${JSON.stringify(cart)}`);
              }
              const item = cart.body.items[0];
              if (Number(item.variant_id) !== EXPECTED_VARIANT) {
                throw new Error(`Wrong variant: ${item.variant_id}`);
              }
              if (Number(item.final_line_price || item.line_price || item.price) !== EXPECTED_PRICE) {
                throw new Error(`Wrong price: ${item.final_line_price || item.line_price || item.price}`);
              }

              await page.goto('https://kennzeichen-krefeld.com/checkout', {
                waitUntil: 'domcontentloaded',
                timeout: 90000,
              });
              await sleep(1000);
              const finalUrl = page.url();
              await page.screenshot({ path: 'checkout.png', fullPage: false });
              if (!isCheckout(finalUrl)) {
                throw new Error(`Checkout not reached: ${finalUrl}`);
              }

              const result = {
                passed: true,
                emergencyPage: PAGE,
                finalUrl,
                variantId: Number(item.variant_id),
                price: Number(item.final_line_price || item.line_price || item.price),
                noOrderCompleted: true,
                noPaymentSubmitted: true,
              };
              console.log(`[success] ${JSON.stringify(result)}`);
              fs.writeFileSync('result.json', JSON.stringify(result, null, 2));

              const postClear = await clearCart();
              fs.writeFileSync('post-clear.json', JSON.stringify(postClear, null, 2));
              if (postClear.status !== 200 || postClear.body.item_count !== 0) {
                throw new Error(`Test cart was not cleared: ${JSON.stringify(postClear)}`);
              }
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

          xvfb-run -a node test.js | tee test.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-order-page-test
          path: /tmp/kfz-emergency-page-test
          if-no-files-found: error
          retention-days: 1
