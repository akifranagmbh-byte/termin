name: Verify emergency order link from live storefront

on:
  pull_request:
    paths:
      - '.github/workflows/verify-emergency-menu-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-homepage-and-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Open the newly published homepage and reach Shopify checkout
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/kfz-menu-live-test
          mkdir -p "$OUT"
          cd "$OUT"
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-audit --no-fund >/dev/null

          cat > test.js <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const STORE = 'https://kennzeichen-krefeld.com';
          const ORDER_PAGE = '/pages/zulassung-jetzt-bestellen';
          const VARIANT = '51237294539018';
          const candidates = [
            '/usr/bin/google-chrome-stable',
            '/usr/bin/google-chrome',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ];
          const executablePath = candidates.find((path) => fs.existsSync(path));
          if (!executablePath) throw new Error('Chrome/Chromium not found');

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const isCheckout = (url) => /\/checkouts?\//.test(url) || url.includes('/checkout');

          function browserOptions() {
            return {
              executablePath,
              headless: false,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--no-first-run',
                '--no-default-browser-check',
                '--window-size=1440,1100',
              ],
            };
          }

          async function newPage(context) {
            const page = await context.newPage();
            await page.setViewport({ width: 1440, height: 1100, deviceScaleFactor: 1 });
            await page.setExtraHTTPHeaders({
              'Cache-Control': 'no-cache, no-store, max-age=0',
              Pragma: 'no-cache',
            });
            return page;
          }

          async function readCheckout(page) {
            await sleep(1200);
            return page.evaluate(() => ({
              url: location.href,
              title: document.title,
              text: document.body.innerText.slice(0, 10000),
            }));
          }

          (async () => {
            const browser = await puppeteer.launch(browserOptions());
            const context = await browser.createBrowserContext();
            const page = await newPage(context);

            try {
              const response = await page.goto(`${STORE}/?published-emergency-test=${Date.now()}`, {
                waitUntil: 'networkidle2',
                timeout: 90000,
              });
              if (!response || !response.ok()) {
                throw new Error(`Homepage failed: ${response ? response.status() : 'no response'}`);
              }

              const homepageState = await page.evaluate((variant, orderPage) => {
                const visible = (element) => {
                  if (!element) return false;
                  const style = getComputedStyle(element);
                  const rect = element.getBoundingClientRect();
                  return (
                    !element.hidden &&
                    style.display !== 'none' &&
                    style.visibility !== 'hidden' &&
                    Number(style.opacity || '1') > 0 &&
                    rect.width > 0 &&
                    rect.height > 0
                  );
                };

                const direct = document.querySelector('#kfz-direct-order-20260811');
                const directForm = Array.from(document.querySelectorAll('#kfz-direct-order-20260811 form')).find(
                  (form) => form.querySelector(`input[name="id"][value="${variant}"]`)
                );
                const legacy = document.querySelector('#df-intake-form');
                const menuLinks = Array.from(document.querySelectorAll('a')).filter((link) => {
                  const href = link.getAttribute('href') || '';
                  return (
                    /JETZT\s+ZULASSUNG\s+BESTELLEN/i.test(link.textContent || '') ||
                    href.includes(orderPage) ||
                    href.includes('/bestellen')
                  );
                });
                const visibleMenuLink = menuLinks.find(visible);
                const bodyText = document.body.innerText || '';

                return {
                  url: location.href,
                  title: document.title,
                  theme: window.Shopify?.theme || null,
                  directExists: Boolean(direct),
                  directVisible: visible(direct),
                  directHeading: direct?.querySelector('h2')?.textContent?.trim() || '',
                  directFormExists: Boolean(directForm),
                  directButtonText: directForm?.querySelector('button')?.textContent?.trim() || '',
                  legacyExists: Boolean(legacy),
                  legacyVisible: visible(legacy),
                  menuLinkCount: menuLinks.length,
                  visibleMenuText: visibleMenuLink?.textContent?.trim() || '',
                  visibleMenuHref: visibleMenuLink?.getAttribute('href') || '',
                  oldFailureTextVisible: /Die sichere Übermittlung ist gerade nicht möglich/i.test(bodyText),
                  oldWaitingTextVisible: /sichere Übermittlung.*nicht möglich/i.test(bodyText),
                };
              }, VARIANT, ORDER_PAGE);

              console.log(`[homepage] ${JSON.stringify(homepageState)}`);
              fs.writeFileSync('homepage.json', JSON.stringify(homepageState, null, 2));
              await page.screenshot({ path: 'homepage.png', fullPage: true });

              if (!homepageState.directExists || !homepageState.directVisible || !homepageState.directFormExists) {
                throw new Error(`The published homepage does not show the direct emergency order form: ${JSON.stringify(homepageState)}`);
              }
              if (homepageState.legacyVisible) {
                throw new Error(`The broken legacy upload form is still visible: ${JSON.stringify(homepageState)}`);
              }
              if (homepageState.oldFailureTextVisible || homepageState.oldWaitingTextVisible) {
                throw new Error(`The old transmission error is still visible: ${JSON.stringify(homepageState)}`);
              }

              const navigation = page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.evaluate((variant) => {
                const form = Array.from(document.querySelectorAll('#kfz-direct-order-20260811 form')).find(
                  (candidate) => candidate.querySelector(`input[name="id"][value="${variant}"]`)
                );
                if (!form) throw new Error('Neuzulassung form not found');
                const button = form.querySelector('button[type="submit"]');
                if (!button) throw new Error('Neuzulassung submit button not found');
                button.click();
              }, VARIANT);
              await navigation;

              const checkoutState = await readCheckout(page);
              console.log(`[homepage-checkout] ${JSON.stringify({ url: checkoutState.url, title: checkoutState.title })}`);
              fs.writeFileSync('homepage-checkout.json', JSON.stringify(checkoutState, null, 2));
              await page.screenshot({ path: 'homepage-checkout.png', fullPage: false });

              if (!isCheckout(checkoutState.url)) {
                throw new Error(`Homepage order button did not reach checkout: ${checkoutState.url}`);
              }
              if (!/KFZ Anmeldung|Neuzulassung/i.test(checkoutState.text)) {
                throw new Error('Expected Zulassung product not visible in checkout');
              }
              if (!/120[,.]00|120\s*€/i.test(checkoutState.text)) {
                throw new Error('Expected 120 EUR price not visible in checkout');
              }

              const result = {
                passed: true,
                liveTheme: homepageState.theme,
                homepageDirectForm: true,
                brokenLegacyFormVisible: false,
                oldErrorVisible: false,
                menuLinkVisible: Boolean(homepageState.visibleMenuText),
                menuText: homepageState.visibleMenuText,
                checkoutUrl: checkoutState.url,
                product: 'KFZ Anmeldung / Neuzulassung',
                price: '120,00 EUR',
                orderCompleted: false,
                paymentSubmitted: false,
              };
              fs.writeFileSync('result.json', JSON.stringify(result, null, 2));
              console.log(`[success] ${JSON.stringify(result)}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

          xvfb-run -a node test.js | tee test.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-menu-live-test
          path: /tmp/kfz-menu-live-test
          if-no-files-found: error
          retention-days: 1
